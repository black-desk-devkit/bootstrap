schema_version: 1

context:
  version: "16.2.0"

# This recipe does not compile anything. After a stage's gcc-toolchain package
# has been built, these aliases expose it under the stable gcc/gxx interface
# consumed by the next invocation of recipes/gcc-toolchain. The meta_ build
# string marks outputs that contain metadata only.
recipe:
  name: gcc-aliases
  version: ${{ version }}

build:
  number: 0

outputs:
  - package:
      name: gcc
      version: ${{ version }}
    build:
      string: meta_h${{ hash }}_${{ build_number }}
      script: echo "gcc interface alias"
      files: []
    requirements:
      run:
        # The compiler carrier owns the complete GCC/G++ installation tree.
        - gcc-toolchain ==${{ version }}
        # Keep the matching native binutils in the compiler interface. It has
        # no embedded sysroot, matching the host-integrating compiler policy.
        - binutils ==2.46.1
    tests:
      - script:
          - gcc --version
          - gcc -O2 -Wall -Werror tests/hello.c -o hello-c
          - ./hello-c
        files:
          recipe:
            - tests/

  - package:
      name: gxx
      version: ${{ version }}
    build:
      string: meta_h${{ hash }}_${{ build_number }}
      script: echo "gxx interface alias"
      files: []
    requirements:
      run:
        # Keep the conventional dependency direction: the C++ interface also
        # selects the C interface, and both point at the same carrier build.
        - ${{ pin_subpackage('gcc', exact=True) }}
        - gcc-toolchain ==${{ version }}
    tests:
      - script:
          - g++ --version
          - g++ -O2 -std=c++20 -Wall -Werror tests/hello.cpp -o hello-cxx
          - ./hello-cxx
        files:
          recipe:
            - tests/

about:
  homepage: https://gcc.gnu.org/
  license: GPL-3.0-or-later WITH GCC-exception-3.1 AND LGPL-2.0-or-later AND LGPL-3.0-or-later AND MIT
  summary: Stable gcc and gxx interface aliases for the devkit bootstrap
  description: Empty metapackages that expose the stage's coarse gcc-toolchain carrier under the conventional compiler names.
  repository: https://gcc.gnu.org/git/gcc.git
  documentation: https://gcc.gnu.org/onlinedocs/

extra:
  bootstrap-role: compiler-interface
