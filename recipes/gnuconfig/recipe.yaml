schema_version: 1

context:
  version: "2025.07.09"

package:
  name: gnuconfig
  version: ${{ version }}

source:
  # Vendored from GNU config commit a2287c3041a3f2a204eb942e09c015eab00dc7dd:
  # config.guess 50205cf3ec5c7615b17f937a0a57babf4ec5cd0aade3d7b3cccbe5f1bf91a7ef
  # config.sub   26b852f75a637448360a956931439f7e818bf63150eaadb9b85484347628d1fd
  # Keeping the scripts in-tree makes this metadata-only package fully
  # reproducible without a network fetch.
  path: source

build:
  noarch: generic
  number: 0
  string: h${{ hash }}_${{ build_number }}
  script:
    - mkdir -p "${PREFIX}/share/gnuconfig"
    - cp "${SRC_DIR}/config.guess" "${PREFIX}/share/gnuconfig/config.guess"
    - cp "${SRC_DIR}/config.sub" "${PREFIX}/share/gnuconfig/config.sub"
    - chmod +x "${PREFIX}/share/gnuconfig/config.guess" "${PREFIX}/share/gnuconfig/config.sub"

requirements: {}

tests:
  - package_contents:
      files:
        - share/gnuconfig/config.guess
        - share/gnuconfig/config.sub

  - script:
      - "${PREFIX}/share/gnuconfig/config.guess > guessed-triplet"
      - test -s guessed-triplet
      - test "$("${PREFIX}/share/gnuconfig/config.sub" x86_64-pc-linux-gnu)" = x86_64-pc-linux-gnu

about:
  homepage: https://savannah.gnu.org/projects/config/
  license: GPL-3.0-or-later WITH Autoconf-exception-2.0
  license_file: LICENSE.txt
  summary: Updated config.guess and config.sub scripts from GNU
  description: Canonical platform detection scripts used to refresh Autotools inputs during source builds.
  repository: https://git.savannah.gnu.org/r/config.git

extra:
  bootstrap-role: build-metadata
