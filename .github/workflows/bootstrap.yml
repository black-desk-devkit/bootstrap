name: GCC bootstrap

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    name: Build bootstrap toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
          run-install: true

      - name: Run bootstrap
        run: pixi run bootstrap
